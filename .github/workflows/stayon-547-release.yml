name: Publish official STAYON+ 5.4.7
on:
  push:
    branches: [release/stayon-547-publisher]
    paths: [.github/workflows/stayon-547-release.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct and verify the offline-signed APK
        run: |
          set -euo pipefail
          gh run download 42457025018 --repo "$GITHUB_REPOSITORY" --name StayON-5.4.7-unsigned-release --dir "$RUNNER_TEMP/unsigned"
          gh run download 42457025018 --repo "$GITHUB_REPOSITORY" --name apk-signing-tool --dir "$RUNNER_TEMP/signing-tool"
          python3 .github/stayon-release/rebuild_signed_apk.py "$RUNNER_TEMP/unsigned/app-standard-release-unsigned.apk" .github/stayon-release/stayon547-reconstruction.b64 "$RUNNER_TEMP/STAYONplus-5.4.7.apk"
          printf '%s  %s\n' 0a669d1c9697bf1e8609507918ec9206f9d69d5739a2f05fd01e2ed6fe6853c0 "$RUNNER_TEMP/STAYONplus-5.4.7.apk" | sha256sum -c
          java -jar "$RUNNER_TEMP/signing-tool/apksigner.jar" verify --print-certs "$RUNNER_TEMP/STAYONplus-5.4.7.apk" | grep -F 801bde35b2bcefcfe4fa65348b59d8e9b7053600b88842116e22f1979724be2f
      - name: Publish and verify the stable release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = fa4683133dd897b5ee64458cdda73870f7668aa4
          if gh release view v5.4.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v5.4.7 already exists. Refusing to overwrite it.'
            exit 1
          fi
          gh release create v5.4.7 "$RUNNER_TEMP/STAYONplus-5.4.7.apk" --repo "$GITHUB_REPOSITORY" --target fa4683133dd897b5ee64458cdda73870f7668aa4 --title 'STAYON+ 5.4.7 para Android TV' --notes-file .github/stayon-release/stayon547-notes.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx v5.4.7
          gh release view v5.4.7 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
