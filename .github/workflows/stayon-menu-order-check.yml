name: Verify STAYON seven-section menu

on:
  push:
    branches:
      - feature/stayon-config-seven-sections
    paths:
      - owntv_tdt/app/src/main/java/tv/own/owntv/features/shell/components/SettingsScreen.kt
      - owntv_tdt/app/src/main/java/tv/own/owntv/features/shell/components/SettingsShell.kt
      - owntv_tdt/app/src/main/java/tv/own/owntv/features/shell/components/StayonOrderedSettingsHub.kt
      - owntv_tdt/app/src/main/assets/stayon_settings_order.json
      - .github/workflows/stayon-menu-order-check.yml
      - owntv_tdt/tools/i18n/safe_literals.txt
      - owntv_tdt/app/src/main/res/values/strings_stayon_order.xml
      - owntv_tdt/app/src/main/res/values-es/strings_stayon_order.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile STAYON Android TV
        working-directory: owntv_tdt
        run: ./gradlew :app:compileStandardDebugKotlin --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
