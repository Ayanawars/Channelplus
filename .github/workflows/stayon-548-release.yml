name: Publish official STAYON+ 5.4.8
on:
  push:
    branches: [release/stayon-548-publisher]
    paths: [.github/workflows/stayon-548-release.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct and verify the offline-signed APK
        run: |
          set -euo pipefail
          gh run download 42496581817 --repo "$GITHUB_REPOSITORY" --name StayON-5.4.8-unsigned-release --dir "$RUNNER_TEMP/unsigned"
          gh run download 42496581817 --repo "$GITHUB_REPOSITORY" --name apk-signing-tool --dir "$RUNNER_TEMP/signing-tool"
          python3 .github/stayon-release/rebuild_signed_apk.py "$RUNNER_TEMP/unsigned/app-standard-release-unsigned.apk" .github/stayon-release/stayon548-reconstruction.b64 "$RUNNER_TEMP/STAYONplus-5.4.8.apk"
          printf '%s  %s\n' ace57a5ddf24bfdfc826e6f8fb6f7378434137ac07dc9d891f1ea3d174da4cae "$RUNNER_TEMP/STAYONplus-5.4.8.apk" | sha256sum -c
          java -jar "$RUNNER_TEMP/signing-tool/apksigner.jar" verify --print-certs "$RUNNER_TEMP/STAYONplus-5.4.8.apk" | grep -F 801bde35b2bcefcfe4fa65348b59d8e9b7053600b88842116e22f1979724be2f
      - name: Publish and verify the stable release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = 006b10fab9ef637fa9c384cc203d06f37c0c5e92
          if gh release view v5.4.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v5.4.8 already exists. Refusing to overwrite it.'
            exit 1
          fi
          gh release create v5.4.8 "$RUNNER_TEMP/STAYONplus-5.4.8.apk" --repo "$GITHUB_REPOSITORY" --target 006b10fab9ef637fa9c384cc203d06f37c0c5e92 --title 'STAYON+ 5.4.8 para Android TV' --notes-file .github/stayon-release/stayon548-notes.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx v5.4.8
          gh release view v5.4.8 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
