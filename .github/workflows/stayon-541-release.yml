name: Publish StayON+ 5.4.1 signed Android TV release
on:
  push:
    branches: [release/stayon-541-publisher]
    paths:
      - .github/workflows/stayon-541-release.yml
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Publish verified existing production APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the passed production build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          gh run download 42307577851 \
            --repo "$GITHUB_REPOSITORY" \
            --name "StayON-5.4.1-unsigned-release" \
            --dir "$RUNNER_TEMP/unsigned"
          test -s "$RUNNER_TEMP/unsigned/app-standard-release-unsigned.apk"
      - name: Reconstruct previously signed and verified APK (without private keys)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stayon-release/rebuild_signed_apk.py \
            "$RUNNER_TEMP/unsigned/app-standard-release-unsigned.apk" \
            .github/stayon-release/stayon541-reconstruction.b64 \
            "$RUNNER_TEMP/StayONplus-5.4.1.apk"
          sha256sum "$RUNNER_TEMP/StayONplus-5.4.1.apk"
      - name: Publish GitHub Release for the in-app updater
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v5.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v5.4.1 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "v5.4.1" "$RUNNER_TEMP/StayONplus-5.4.1.apk#StayONplus-5.4.1.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "b45d1d53d7c19c7d5ff99b1f5872fc4279973436" \
            --title "StayON+ 5.4.1 — Intro, Música e iconos" \
            --notes "Nueva versión de StayON+ para Android TV: intro original de 5 segundos con audio (Atrás para saltarla), logos de Spotify, YouTube Music y Amazon Music (integraciones aún pendientes), cinco variantes del icono elegibles en Ajustes. Sin cambios en TDT/IPTV ni LOVEStv. APK ARM firmada con el certificado original, apta para actualizar sin borrar datos."
      - name: Verify published release and APK asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view v5.4.1 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
