name: Publish official STAYON+ 5.4.9
on:
  push:
    branches: [release/stayon-549-publisher]
    paths: [.github/workflows/stayon-549-release.yml, .github/stayon-release/stayon549-mini.b64]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct and verify the offline-signed STAYON+ APK
        run: |
          set -euo pipefail
          gh run download 42504438486 --repo "$GITHUB_REPOSITORY" --name StayON-5.4.9-unsigned-release --dir "$RUNNER_TEMP/unsigned"
          gh run download 42504438486 --repo "$GITHUB_REPOSITORY" --name apk-signing-tool --dir "$RUNNER_TEMP/signing-tool"
          python3 .github/stayon-release/rebuild_signed_apk.py "$RUNNER_TEMP/unsigned/app-standard-release-unsigned.apk" .github/stayon-release/stayon549-mini.b64 "$RUNNER_TEMP/STAYONplus-5.4.9.apk"
          printf '%s  %s\n' 580bb9aca689daab16f44d67ab616b831d17249190c867501e2a14fd962f5faf "$RUNNER_TEMP/STAYONplus-5.4.9.apk" | sha256sum -c
          java -jar "$RUNNER_TEMP/signing-tool/apksigner.jar" verify --print-certs "$RUNNER_TEMP/STAYONplus-5.4.9.apk" | grep -F 801bde35b2bcefcfe4fa65348b59d8e9b7053600b88842116e22f1979724be2f
      - name: Publish verified 5.4.9 release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = 39da5733b383ee68663d77ae74d5848e9c665419
          if gh release view v5.4.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v5.4.9 already exists. Refusing to overwrite it.'
            exit 1
          fi
          gh release create v5.4.9 "$RUNNER_TEMP/STAYONplus-5.4.9.apk" --repo "$GITHUB_REPOSITORY" --target 39da5733b383ee68663d77ae74d5848e9c665419 --title 'STAYON+ 5.4.9 para Android TV' --notes-file .github/stayon-release/stayon549-notes.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx v5.4.9
          gh release view v5.4.9 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
