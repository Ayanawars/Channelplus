name: STAYON+ 5.4.9 production build
on:
  push:
    branches: [main, codex/complete-import-channel-review]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Save APK signing tool
        run: cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" owntv_tdt/app/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: owntv_tdt/app/apksigner.jar
      - name: Build official release
        working-directory: owntv_tdt
        env:
          VERSION_CODE: '101009'
          VERSION_NAME: '5.4.9'
        run: ./gradlew :app:assembleStandardRelease --no-daemon --build-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        with:
          name: StayON-5.4.9-unsigned-release
          path: owntv_tdt/app/build/outputs/apk/standard/release/*-unsigned.apk
          if-no-files-found: error
