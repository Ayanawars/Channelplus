name: Channelplus checks
on:
  push:
    branches: [main, codex/complete-import-channel-review]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Save APK signing tool
        run: cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" owntv_tdt/app/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: owntv_tdt/app/apksigner.jar
      - name: Check and build production APK
        working-directory: owntv_tdt
        run: ./gradlew :app:testStandardDebugUnitTest :owntv_core_tdt:core:testDebugUnitTest :owntv_core_tdt:player-core:testDebugUnitTest :app:assembleStandardRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - name: Create temporary key for isolated TCL diagnostic preview
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/tcl-v138-timeshift-tif'
        working-directory: owntv_tdt
        run: keytool -genkeypair -keystore test-signing.jks -storepass android -keypass android -alias tunerprobe -keyalg RSA -keysize 2048 -validity 365 -dname "CN=STAYON Diagnostic,O=STAYON,C=ES"
      - name: Build TCL Timeshift diagnostic APK
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/tcl-v138-timeshift-tif'
        working-directory: owntv_tdt
        run: ./gradlew :app:assembleStandardDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/tcl-v138-timeshift-tif'
        with:
          name: STAYON-TCL-V138-timeshift-diagnostic-APK
          path: owntv_tdt/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: StayON-unsigned-release
          path: owntv_tdt/app/build/outputs/apk/standard/release/*-unsigned.apk
          if-no-files-found: error
