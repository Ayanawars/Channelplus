name: Build Channel+ 5.3.12 LOVEStv TCL direct Activity root

on:
  push:
    branches:
      - codex/channelplus-5.3.7-lovestv-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hbbtv32:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Overlay exact 5.3.7 LOVEStv source changes
        run: |
          echo "fea649552eb21f7a5df958a20dbb1cf6915b186b701a346aca498be434b8173b  ci/channelplus-5.3.7-overlay.zip" | sha256sum -c -
          unzip -oq ci/channelplus-5.3.7-overlay.zip -d .
          test -f owntv_tdt/app/src/main/java/tv/own/owntv/features/hbbtv/HbbTvActivityHost.java
          test -f owntv_tdt/app/libs/lovestv-runtime.jar
          python3 tools/hbbtv/verify_channelplus_145.py
      - name: Fix Channel+ startup regression in TCL 32-bit process
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("owntv_tdt/app/src/main/java/tv/own/owntv/features/hbbtv/HbbTvLauncher.java")
          code = p.read_text(encoding="utf-8")
          old1 = 'return "com.tcl.tv".equals(android.app.Application.getProcessName());'
          new1 = 'return "com.tcl.tv".equals(android.app.Application.getProcessName()) && !"com.tcl.tv".equals(context.getApplicationInfo().processName);'
          old2 = 'return "com.tcl.tv".equals(process.processName);'
          new2 = 'return "com.tcl.tv".equals(process.processName) && !"com.tcl.tv".equals(context.getApplicationInfo().processName);'
          assert code.count(old1)==1 and code.count(old2)==1, "Unexpected launcher source: stop"
          code = code.replace(old1,new1).replace(old2,new2)
          p.write_text(code,encoding="utf-8")
          assert 'android:process="com.tcl.tv"' in Path("owntv_tdt/app/src/hbbtv32/AndroidManifest.xml").read_text()
          assert "isRuntimeProcess(this)" in Path("owntv_tdt/app/src/main/java/tv/own/owntv/OwnTVApp.kt").read_text()
          print("PASS: Channel+ app process is not confused with the vendor-only process. Koin startup enabled.")
          PY
      - name: Repair HbbTV remote and observable startup
        run: |
          python3 tools/hbbtv/fix_539_key_routing.py
          python3 tools/hbbtv/fix_539_reliability.py
          python3 tools/hbbtv/verify_channelplus_145.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owntv_tdt/app/src/main/java/tv/own/owntv/features/hbbtv/HbbTvPlayerView.java').read_text()
          s=Path('owntv_tdt/app/src/main/java/tv/own/channelplus/lovestvprobe/HbbTvRuntimeService.java').read_text()
          shell=Path('owntv_tdt/app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt').read_text()
          assert 'Delivering queued colour key=' in p
          assert 'TCL runtime bind callback timed out' in p
          assert 'HbbTV service onCreate pid=' in s
          assert 'val channel = previewChannel' not in shell.split('val hbbKeyHandler by',1)[1].split('DisposableEffect(hbbActivity)',1)[0]
          print('PASS: startup, colour key queue, service visibility and fullscreen navigation checks')
          PY
      - name: Native LOVEStv 1.45 autostart parity (without coloured key)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owntv_tdt/app/src/main/java/tv/own/channelplus/lovestvprobe/HbbTvRuntimeService.java')
          s=p.read_text(encoding='utf8')
          def replace(old,new):
              global s
              assert s.count(old)==1, (old[:100],s.count(old))
              s=s.replace(old,new)
          replace('private Object engine,browser,initListener;', 'private Object engine,browser,initListener,eventNotify,eventListener;')
          replace('root=new FrameLayout(windowContext); root.setBackgroundColor(Color.TRANSPARENT); root.setAlpha(0f); root.setFocusable(false);',
                  'root=new FrameLayout(windowContext); root.setBackgroundColor(Color.TRANSPARENT); root.setAlpha(1f); root.setVisibility(View.VISIBLE); root.setFocusable(false); root.setClipChildren(false); root.setClipToPadding(false); Log.i(TAG,"Native HbbTV browser host visible before initialization");')
          replace('        initializing=true;\n        main.removeCallbacks(timeout);',
                  '        initializing=true;\n        visibility(); // display transparent host during native browser initialization; no remote key\n        main.removeCallbacks(timeout);')
          replace('ExperimentalAuthorization.begin(this,authorized->main.post(()->{',
                  'ExperimentalAuthorization.begin(windowContext!=null?windowContext:this,authorized->main.post(()->{')
          replace('                prepareKeys();\n                browser=singleton("com.tcl.tbrowser.Tbrowser");',
                  '                prepareKeys();\n                registerBroadcastEvents();\n                browser=singleton("com.tcl.tbrowser.Tbrowser");')
          replace('    private void prepareKeys() throws ReflectiveOperationException {',
          '''    // The working 1.45 probe registers native broadcaster events BEFORE Tbrowser init.
              // Log genuine broadcast AIT/HbbTV state, never fabricate a side-button prompt.
              private void registerBroadcastEvents() {
                  try {
                      Class<?> t=Class.forName("com.tcl.hbbtv.HbbtvEventNotify");
                      Class<?> l=Class.forName("com.tcl.hbbtv.HbbtvEventListener");
                      eventNotify=t.getMethod("getInstance",Context.class).invoke(null,windowContext);
                      eventListener=Proxy.newProxyInstance(l.getClassLoader(),new Class<?>[]{l},(proxy,method,args)->{
                          if(method.getDeclaringClass()==Object.class) return objectMethod(proxy,method,args);
                          Log.i(TAG,"TCL broadcaster HbbTV event="+method.getName()+" channel="+channelId+" args="+java.util.Arrays.toString(args));
                          return defaultValue(method.getReturnType());
                      });
                      t.getMethod("registerHbbtvEventListener",l).invoke(eventNotify,eventListener);
                      Log.i(TAG,"Native broadcaster event listener registered (LOVEStv 1.45)");
                  } catch(Exception | LinkageError error) {
                      Log.w(TAG,"Native broadcaster event listener unavailable",error);
                  }
              }
              private void prepareKeys() throws ReflectiveOperationException {''')
          replace('private void visibility() { if(root!=null) root.setAlpha(running && ready && !hidden ? 1f : 0f); }',
                  'private void visibility() { if(root!=null) { boolean show=ready && !hidden && (initializing || running); root.setAlpha(show ? 1f : 0f); if(show) root.bringToFront(); } }')
          replace('            visibility(); reply(STARTED,new Bundle()); inspect.run();',
                  '            visibility(); Log.i(TAG,"Native HbbTV autostart completed without pressing any key; awaiting broadcaster LOVEStv side hints"); reply(STARTED,new Bundle()); inspect.run();')
          p.write_text(s,encoding='utf8')
          assert 'registerBroadcastEvents();' in s and 'boolean show=ready' in s
          print('PASS: native Tbrowser visible during startup; broadcaster event listener registered; colour key not required')
          PY
      - name: Enable native HbbTV autostart for every full-screen TCL TDT tune
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shell=Path('owntv_tdt/app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt')
          code=shell.read_text(encoding='utf-8')
          old='hbbTvEnabled = isFull && zapSource == MainSection.LIVE_TV && !catchupActive,'
          new='hbbTvEnabled = isFull && !catchupActive,'
          assert code.count(old)==1, "Fullscreen TDT HbbTV gate changed; refuse blind patch"
          shell.write_text(code.replace(old,new),encoding='utf-8')
          manifest=Path('owntv_tdt/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert '<service android:name="tv.own.channelplus.lovestvprobe.HbbTvRuntimeService"' in manifest
          assert 'android:process="com.tcl.tv"' in manifest
          view=Path('owntv_tdt/app/src/main/java/tv/own/owntv/player/MpvVideoSurface.kt').read_text(encoding='utf-8')
          assert 'if (antenna)' in view and 'it.updateHbbTv(tunerVideo.inputId' in view
          print('PASS: full-screen native TCL TDT starts HbbTV regardless of EPG, restored channel or TV entry route')
          print('PASS: runtime service declared in manifest and tuner view invokes updateHbbTv')
          PY
      - name: Replace experimental browser surface with LOVEStv 1.45 Activity view
        run: |
          python3 tools/hbbtv/fix_5312_direct_activity.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owntv_tdt/app/src/main/java/tv/own/channelplus/lovestvprobe/HbbTvRuntimeService.java').read_text()
          v=Path('owntv_tdt/app/src/main/java/tv/own/owntv/features/hbbtv/HbbTvPlayerView.java').read_text()
          assert 'activityParent.addView(root,new ViewGroup.LayoutParams(-1,-1))' in p
          assert 'viewHost=new SurfaceControlViewHost' not in p
          assert 'activity.getDisplay().getDisplayId()' in v
          assert 'engine.attachTvInputView(tvView)' in Path('owntv_tdt/app/src/main/java/tv/own/owntv/player/MpvVideoSurface.kt').read_text()
          print('PASS: exact 1.45 Activity root integration, existing TvView preserved')
          PY
      - name: Classify HbbTV technical diagnostics for i18n inventory
        working-directory: owntv_tdt
        run: |
          set -e
          for text in 'ChannelplusHbb' 'Remote=' 'consumedByHbb=' 'shellHandler='; do
            python3 tools/i18n/check_hardcoded_strings.py classify-safe \
              --path app/src/main/java/tv/own/owntv/MainActivity.kt \
              --text "$text" --category log
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate disposable CI certificate (test builds only)
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android -alias tunerprobe -keyalg RSA -validity 30 -dname 'CN=Channelplus CI'
      - name: Build TCL HbbTV 32-bit APK
        working-directory: owntv_tdt
        env:
          CHANNELPLUS_TEST_KEYSTORE: ${{ runner.temp }}/ci.jks
          VERSION_CODE: '100023'
          VERSION_NAME: '5.3.12-LOVEStv-DirectActivity'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleHbbtv32Debug --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - name: Upload TCL test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Channelplus-5.3.12-LOVEStv-hbbtv32-CI
          path: owntv_tdt/app/build/outputs/apk/hbbtv32/debug/*.apk
          if-no-files-found: error
      - name: Upload Android signing tool
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-android-37
          path: /opt/android-sdk/build-tools/37.0.0/lib/apksigner.jar
          if-no-files-found: warn
