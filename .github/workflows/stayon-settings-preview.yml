name: Build STAYON Settings Preview APK
on:
  push:
    branches:
      - stayon-settings-preview
    paths:
      - settings-preview/**
      - .github/workflows/stayon-settings-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android TV debug APK
        working-directory: settings-preview
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: STAYON-Settings-Preview-debug-APK
          path: settings-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
