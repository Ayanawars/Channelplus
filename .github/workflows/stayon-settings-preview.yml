name: Build STAYON Settings Preview APK
on:
  push:
    branches: [stayon-settings-preview]
    paths: ['settings-preview/**', '.github/workflows/stayon-settings-preview.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settings-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: STAYON-Settings-Preview-debug-APK
          path: settings-preview/app/build/outputs/apk/debug/app-debug.apk
